name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  package:
    name: Package release artifact
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build tarball artifact
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output "dist/smartwatt-api-${GITHUB_SHA}.tar.gz" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartwatt-api-${{ github.sha }}
          path: dist/smartwatt-api-${{ github.sha }}.tar.gz
          retention-days: 14
